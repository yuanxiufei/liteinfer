name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    name: lint / type / tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（可编辑 + dev 依赖）
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: 静态检查
        run: python -m ruff check .
      - name: 类型检查
        run: python -m mypy
      - name: 单元测试（不需要 GPU）
        run: python -m pytest -m unit -q
      - name: 集成测试（不需要 GPU）
        run: python -m pytest -m integration -q

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # 依赖组合尚未锁定（WBS-0.2），当前只报告不阻断；锁定后应改为阻断。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装与审计
        run: |
          python -m pip install -U pip pip-audit
          python -m pip install -e ".[dev]"
          python -m pip freeze > /tmp/freeze.txt
          python -m pip_audit --requirement /tmp/freeze.txt
